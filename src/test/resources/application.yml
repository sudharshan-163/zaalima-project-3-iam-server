spring:
  application:
    name: iam-server-test

  datasource:
    url: jdbc:h2:mem:zaalima_iam_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379

server:
  port: 8085
