<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaalima IAM - Two-Factor Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(15, 23, 42, 0.75);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 14px;
            border-radius: 100px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
        }

        h2 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .error-alert {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .code-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            letter-spacing: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        .code-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(15, 23, 42, 0.85);
        }

        .btn-verify {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #04111d;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn-verify:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-badge">? Zaalima IAM Security</div>
        
        <div class="icon-circle">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h2>Two-Factor Challenge</h2>
        <p class="subtitle">Enter the 6-digit TOTP security code from your Google Authenticator or mobile app.</p>

        <!-- Dynamic Error Alert if code is invalid or session expired -->
        <div class="error-alert" th:if="${error != null or param.error != null}">
            <span>??</span>
            <span th:text="${error}">Invalid or expired MFA code.</span>
        </div>

        <form method="post" action="/mfa">
            <div class="form-group">
                <label for="code">AUTHENTICATOR SECURITY CODE</label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    class="code-input"
                    placeholder="······"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    required
                    autofocus
                    autocomplete="one-time-code"
                />
            </div>

            <button type="submit" class="btn-verify">Verify & Unlock Dashboard</button>
        </form>

        <a href="/login.html" class="back-link">? Cancel & Back to Login</a>
    </div>

</body>
</html>
