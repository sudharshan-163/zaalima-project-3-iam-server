services:
  iam-postgres:
    image: postgres:16-alpine
    container_name: iam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zaalima_iam}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zaalima_iam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-network

  iam-redis:
    image: redis:7-alpine
    container_name: iam-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-network

  iam-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iam-server
    restart: unless-stopped
    depends_on:
      iam-postgres:
        condition: service_healthy
      iam-redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8085}:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://iam-postgres:5432/${POSTGRES_DB:-zaalima_iam}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: iam-redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - iam-network

volumes:
  postgres_data:
  redis_data:

networks:
  iam-network:
    driver: bridge
